ruleDirs: [packages/sage-core/lint/rules]
utilDirs: [packages/sage-core/lint/utils]
languageInjections:
  - hostLanguage: yaml
    rule:
      pattern: $CONTENT
      kind: block_scalar
      inside:
        kind: block_node
        inside:
          kind: block_mapping_pair
          has: { field: key, regex: '^run$' }
    injected: bash
