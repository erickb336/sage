id: no-comments-python
valid:
  - 'x = "# not a comment"'
  - "y = '''\n# inside a string\n'''"
  - "#!/usr/bin/env python3\nx = 1"
  - "# -*- coding: utf-8 -*-\nx = 1"
  - "#!/usr/bin/env python3\n# coding: utf-8\nx = 1"
  - 'import os  # noqa: F401'
  - 'import os, sys  # noqa: F401, E401'
  - 'x = f()  # type: ignore[attr-defined]'
  - 'x = f()  # pyright: ignore[reportAttributeAccessIssue]'
  - '# pyright: strict'
  - 'def f():  # pragma: no cover'
  - '# fmt: off'
  - 'x = [1,2]  # fmt: skip'
  - '# SPDX-License-Identifier: MIT'
  - "#!/usr/bin/env python3 -u\nx = 1"
  - "#!/usr/bin/env -S uv run --script\nx = 1"
  - "#!/usr/bin/env python3\r\n# SPDX-License-Identifier: MIT\r\nimport os  # noqa: F401\r\n"
  - "# -*- coding: utf-8 -*-\r\nx = f()  # type: ignore[attr-defined]\r\ny = 1  # pragma: no cover\r\n"
invalid:
  - '# explain'
  - 'x = 1  # explain'
  - 'import os  # noqa'
  - 'import os  # noqa: F401 because'
  - 'x = f()  # type: ignore'
  - 'x = f()  # type: ignore[attr-defined] why'
  - '# pyright: ignore'
  - '# pragma: no cover because'
  - "x = 1\n#!/usr/bin/env python3"
  - "x = 1\ny = 2\n# -*- coding: utf-8 -*-"
  - "def f():\n    # inside\n    return 1"
  - "x = 1  # explain\r\ny = 2\r\n"
  - "import os  # noqa: F401 because\r\n"
  - "def f():\n    #!/bin/sh\n    return 1"
  - "if x:\n    #!/bin/sh\n    pass"
  - "l = [\n    #!/bin/sh\n    1]"
  - "class A:\n    #!/bin/sh\n    x = 1"
