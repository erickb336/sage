id: no-comments-ruby
valid:
  - '# frozen_string_literal: true'
  - 'x = "# not a comment"'
  - 'x = 1 # rubocop:disable Style/Foo'
  - '# rubocop:disable Metrics/AbcSize, Style/Bar'
  - '# rubocop:enable all'
  - '# typed: strict'
  - '# SPDX-License-Identifier: MIT'
  - "# frozen_string_literal: true\r\n# SPDX-License-Identifier: MIT\r\n# typed: strict\r\nX = 1 # rubocop:disable Style/Foo\r\n"
  - "#!/usr/bin/env ruby\nputs 1"
  - "#!/usr/bin/env ruby\r\n# frozen_string_literal: true\r\nputs 1\r\n"
  - "x = <<MSG\n#{a}##{b} is here\nMSG\n"
  - "x = <<-MSG\n  #{a}##{b} is here\n  MSG\n"
  - "x = <<~MSG\n  #{a}##{b} is here\nMSG\n"
  - "x = <<~`CMD`\n  #{a}##{b} is here\nCMD\n"
invalid:
  - '# explain'
  - 'x = 1 # trailing'
  - 'x = 1 # rubocop:disable Style/Foo -- why'
  - '# frozen_string_literal: true and more'
  - "=begin\nblock comment\n=end"
  - "X = 1 # explain\r\n"
  - "puts 1\n#!/usr/bin/env ruby"
  - "def f\n  #!/usr/bin/env ruby\n  1\nend"
  - "[1].each do |x|\n  #!/usr/bin/env ruby\n  x\nend"
  - "[1].each { |x|\n  #!/usr/bin/env ruby\n  x }"
  - "x = <<~MSG\n  text\nMSG\n# explain\n"
  - "x = <<~MSG\n  #{a # explain\n  }\nMSG\n"
