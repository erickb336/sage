id: no-comments-js
valid:
  - 'const u = "https://example.com//path";'
  - 'const t = `a // b ${1} /* c */`;'
  - "const h = '<!-- not a comment -->';"
  - '// eslint-disable-next-line no-console'
  - '// eslint-disable-next-line no-console, @stylistic/semi'
  - '/* eslint-disable */'
  - '/* eslint-enable react-hooks/exhaustive-deps */'
  - 'f(); // eslint-disable-line no-console'
  - '// prettier-ignore'
  - '/* istanbul ignore next */'
  - '/* c8 ignore next 3 */'
  - '/* v8 ignore start */'
  - 'const p = /*#__PURE__*/ f();'
  - 'const q = /* @__PURE__ */ f();'
  - '/*#__NO_SIDE_EFFECTS__*/ function g() {}'
  - '// SPDX-License-Identifier: MIT'
  - '/* SPDX-License-Identifier: Apache-2.0 OR MIT */'
  - "// SPDX-License-Identifier: MIT\r\nf();\r\n"
  - '#!/usr/bin/env node'
  - 'const r = /\/\/x/;'
  - '/*eslint-disable*/'
  - 'f(); //eslint-disable-line no-console'
  - '//eslint-disable-next-line'
  - '// istanbul ignore next'
invalid:
  - '// explain'
  - 'f(); // trailing'
  - '/* block */'
  - '/** doc */ function f() {}'
  - '// TODO: later'
  - '// eslint-disable-next-line no-console -- why'
  - '// eslint-disable-next-line no-console because'
  - '/* istanbul ignore next: why */'
  - '// SPDX-License-Identifier: MIT, and more words'
  - '// prettier-ignore because'
  - 'const j = <div>{/* jsx */}</div>;'
  - "<!-- legacy html comment"
  - '// c8 ignore next'
  - '// istanbul ignore next because'
