id: no-comments-js
valid:
  - 'const u = "https://example.com//path";'
  - 'const t = `a // b ${1} /* c */`;'
  - "const h = '<!-- not a comment -->';"
  - '// eslint-disable-next-line no-console'
  - '// eslint-disable-next-line no-console, @typescript-eslint/no-explicit-any'
  - '/* eslint-disable */'
  - '/* eslint-enable react-hooks/exhaustive-deps */'
  - 'f(); // eslint-disable-line no-console'
  - '// @ts-expect-error'
  - '// @ts-ignore'
  - '// @ts-nocheck'
  - '// @ts-check'
  - '/// <reference types="node" />'
  - '// prettier-ignore'
  - '/* istanbul ignore next */'
  - '/* c8 ignore next 3 */'
  - '/* v8 ignore start */'
  - 'const p = /*#__PURE__*/ f();'
  - 'const q = /* @__PURE__ */ f();'
  - '/*#__NO_SIDE_EFFECTS__*/ function g() {}'
  - '// SPDX-License-Identifier: MIT'
  - '/* SPDX-License-Identifier: Apache-2.0 OR MIT */'
  - '#!/usr/bin/env node'
  - 'const r = /\/\/x/;'
invalid:
  - '// explain'
  - 'f(); // trailing'
  - '/* block */'
  - '/** doc */ function f() {}'
  - '// TODO: later'
  - '// eslint-disable-next-line no-console -- why'
  - '// eslint-disable-next-line no-console because'
  - '// @ts-ignore: why'
  - '// @ts-expect-error why'
  - '/* istanbul ignore next: why */'
  - '// SPDX-License-Identifier: MIT, and more words'
  - '// prettier-ignore because'
  - 'const j = <div>{/* jsx */}</div>;'
  - "<!-- legacy html comment"
