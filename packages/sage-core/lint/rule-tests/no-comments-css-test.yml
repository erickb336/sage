id: no-comments-css
valid:
  - 'a { background: url("https://example.com//x.png"); }'
  - 'a::before { content: "/* not a comment */"; }'
  - '/* stylelint-disable */'
  - '/* stylelint-disable-next-line color-no-invalid-hex */'
  - '/* stylelint-disable color-named, scss/at-rule-no-unknown */'
  - '/* prettier-ignore */'
  - '/* SPDX-License-Identifier: MIT */'
invalid:
  - '/* explain */'
  - 'a { color: red; /* why */ }'
  - '/* stylelint-disable-next-line color-named -- why */'
  - '/* prettier-ignore because */'
