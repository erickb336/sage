id: no-comments-shell
language: Bash
severity: error
message: Remove this comment, or write a directive from the list in the rule set's README.md with no text after it.
rule:
  kind: comment
  not:
    any:
      - all: [{ regex: '^#!' }, { nthChild: 1 }]
      - regex: '^# shellcheck (disable|enable|source|shell|external-sources)=[\w,./-]+\r?$'
      - matches: spdx
