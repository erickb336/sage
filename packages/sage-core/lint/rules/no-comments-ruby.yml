id: no-comments-ruby
language: Ruby
severity: error
message: Remove this comment, or write a directive from the list in the rule set's README.md with no text after it.
rule:
  kind: comment
  not:
    any:
      - all: [{ regex: '^#!' }, { nthChild: 1 }, { inside: { kind: program } }]
      - regex: '^# frozen_string_literal: (true|false)\r?$'
      - regex: '^# rubocop:(disable|enable|todo) [\w/]+(, ?[\w/]+)*\r?$'
      - regex: '^# typed: (ignore|false|true|strict|strong)\r?$'
      - matches: spdx
      - inside: { kind: heredoc_body }
