id: no-comments-python
language: Python
severity: error
message: Remove this comment, or write a directive from the list in the rule set's README.md with no text after it.
rule:
  kind: comment
  not:
    any:
      - all: [{ regex: '^#!' }, { nthChild: 1 }, { inside: { kind: module } }]
      - all: [{ regex: '^# (-\*- )?coding[:=] ?[\w.-]+( -\*-)?\r?$' }, { any: [{ nthChild: 1 }, { nthChild: 2 }] }]
      - regex: '^# noqa: ?[A-Z]+\d+(, ?[A-Z]+\d+)*\r?$'
      - regex: '^# type: ignore\[[\w-]+(, ?[\w-]+)*\]\r?$'
      - regex: '^# pyright: (ignore\[\w+(, ?\w+)*\]|basic|standard|strict)\r?$'
      - regex: '^# pragma: no (cover|branch)\r?$'
      - regex: '^# fmt: (off|on|skip)\r?$'
      - matches: spdx
