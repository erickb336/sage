id: no-comments-yaml
language: Yaml
severity: error
message: Remove this comment, or write a directive from the list in the rule set's README.md with no text after it.
rule:
  kind: comment
  not:
    any:
      - regex: '^# yaml-language-server: \$schema=\S+$'
      - regex: '^# yamllint (disable-file|(disable|enable)(-line)?( rule:[\w-]+)*)$'
      - matches: spdx
