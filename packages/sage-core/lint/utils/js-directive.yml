id: js-directive
language: JavaScript
rule:
  any:
    - regex: '^(//|/\*) eslint-(disable|enable|disable-line|disable-next-line)( [\w@/-]+(, [\w@/-]+)*)?( \*/)?$'
    - regex: '^// @ts-(expect-error|ignore|nocheck|check)$'
    - regex: '^/// <reference (path|types|lib|no-default-lib)="[^"]*" ?/>$'
    - regex: '^(// prettier-ignore|/\* prettier-ignore \*/)$'
    - regex: '^/\* (istanbul|c8|v8) ignore (next|start|stop|if|else|file)( \d+)? \*/$'
    - regex: '^/\* ?[#@]__(PURE|NO_SIDE_EFFECTS)__ ?\*/$'
