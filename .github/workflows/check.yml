name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Pinned: Playwright 1.55.0 has no headless shell for ubuntu-latest (Ubuntu 26.04 since 2026-10-19).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      # The browser tests use the Chromium headless shell of the pinned playwright devDependency.
      # npm ci downloads no browser; this step does. Playwright advises against a browser cache.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
