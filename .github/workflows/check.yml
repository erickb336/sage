name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    # Pinned: Playwright 1.55.1 has no headless shell for ubuntu-latest (Ubuntu 26.04 since 2026-10-19).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # npm run check reads the diff from the merge base with origin/main (T539: who may change CHANGELOG.md).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The browser tests use the Chromium headless shell of the pinned playwright devDependency.
      # npm ci downloads no browser; this step does. Playwright advises against a browser cache.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
  test:
    # npm test in 4 parallel parts (T912). node --test sorts the test files by path and gives the k-th file to
    # part k mod 4, so each file runs in exactly one part. Each part's log lists its test names (spec reporter).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
  # Branch protection requires this job by its name. It passes only when every job above passed: a failed, cancelled
  # or skipped job fails it.
  check:
    if: always()
    needs: [static, test]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
