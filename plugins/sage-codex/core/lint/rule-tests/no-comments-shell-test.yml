id: no-comments-shell
valid:
  - "#!/bin/sh\necho hi"
  - "#!/usr/bin/env bash\necho hi"
  - 'echo "# not a comment"'
  - "echo '# not a comment'"
  - 'echo hi#no'
  - 'echo ${#arr[@]}'
  - "cat <<X\n# in heredoc\nX"
  - '# shellcheck disable=SC2086'
  - 'echo $x # shellcheck disable=SC2086,SC2046'
  - '# shellcheck source=lib/common.sh'
  - '# SPDX-License-Identifier: MIT'
invalid:
  - '# explain'
  - 'echo hi # trailing'
  - "echo hi\n#!/bin/sh"
  - '# shellcheck disable=SC2086 because'
  - "f() {\n  # inside\n  echo hi\n}"
