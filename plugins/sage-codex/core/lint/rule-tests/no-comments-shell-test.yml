id: no-comments-shell
valid:
  - "#!/bin/sh\necho hi"
  - "#!/usr/bin/env bash\necho hi"
  - 'echo "# not a comment"'
  - "echo '# not a comment'"
  - 'echo hi#no'
  - 'echo ${#arr[@]}'
  - "cat <<X\n# in heredoc\nX"
  - '# shellcheck disable=SC2086'
  - 'echo $x # shellcheck disable=SC2086,SC2046'
  - '# shellcheck source=lib/common.sh'
  - '# SPDX-License-Identifier: MIT'
  - "#!/usr/bin/env -S uv run --script\necho hi"
  - "#!/bin/bash\r\n# SPDX-License-Identifier: MIT\r\n# shellcheck disable=SC2034\r\nX=1\r\n"
invalid:
  - '# explain'
  - 'echo hi # trailing'
  - "echo hi\n#!/bin/sh"
  - '# shellcheck disable=SC2086 because'
  - "f() {\n  # inside\n  echo hi\n}"
  - "echo hi # explain\r\n"
  - "# shellcheck disable=SC2086 because\r\necho $x\r\n"
  - "f() {\n  #!/bin/sh\n  echo hi\n}"
  - "if true; then\n  #!/bin/sh\n  echo hi\nfi"
  - "a=(\n  #!/bin/sh\n  x)"
