id: no-comments-java
valid:
  - 'class A { String u = "https://example.com//x /* y */"; }'
  - 'class A { @SuppressWarnings("unchecked") void f() {} }'
  - '// SPDX-License-Identifier: Apache-2.0'
invalid:
  - '// explain'
  - "class A { int x = 1; // trailing\n}"
  - '/* block */ class A {}'
  - '/** Javadoc. */ class A {}'
