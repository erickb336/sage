id: no-comments-go
language: Go
severity: error
message: Remove this comment, or write a directive from the list in the rule set's README.md with no text after it. A cgo preamble may stay.
rule:
  kind: comment
  not:
    any:
      - regex: '^//go:\w+\r?$'
      - regex: '^//go:(build|generate|embed|linkname|debug|fix|wasmimport|wasmexport|cgo_\w+) \S.*$'
      - regex: '^//nolint:[\w-]+(,[\w-]+)*\r?$'
      - regex: '^//export \w+\r?$'
      - regex: '^// Code generated .+ DO NOT EDIT\.\r?$'
      - matches: spdx
      - precedes:
          stopBy: { not: { kind: comment } }
          kind: import_declaration
          has: { stopBy: end, kind: interpreted_string_literal, regex: '^"C"$' }
