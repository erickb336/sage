id: no-comments-shell
language: Bash
files: ["**/*.yml", "**/*.yaml"]
severity: error
message: Remove this comment, or write a directive from the list in the rule set's README.md with no text after it.
rule:
  kind: comment
  not:
    any:
      - regex: '^# shellcheck( (disable|enable|source|source-path|shell|external-sources)=[\w,./$-]+)+$'
      - matches: spdx
