id: no-comments-css
language: Css
severity: error
message: Remove this comment, or write a directive from the list in the rule set's README.md with no text after it.
rule:
  kind: comment
  not:
    any:
      - regex: '^/\* prettier-ignore \*/$'
      - regex: '^/\* stylelint-(disable|enable|disable-line|disable-next-line)( [\w@/-]+(, [\w@/-]+)*)? \*/$'
      - matches: spdx
