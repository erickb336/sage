id: no-comments-shell
language: Bash
severity: error
message: A comment in code. Only a tool directive from the fixed list or one SPDX line may stay.
rule:
  kind: comment
  not:
    any:
      - all: [{ regex: '^#!/\S+( \S+)?$' }, { nthChild: 1 }]
      - regex: '^# shellcheck (disable|enable|source|shell|external-sources)=[\w,./-]+$'
      - matches: spdx
