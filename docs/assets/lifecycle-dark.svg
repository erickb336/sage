<rect x="36" y="372" width="1028" height="166.39999999999998" rx="4" fill="#1B1E22" stroke="#5E636A" stroke-width="1.2"/>
<text x="64" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ECE6DC" text-anchor="start"><tspan x="64" dy="0">Verified needs 1 clean cycle. Autopilot merges after the task's clean cycles:</tspan><tspan x="64" dy="33.599999999999994">1 for a small task, 2 for a large task or a task with a risk flag.</tspan></text>
<text x="64" y="479.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#A0988E" text-anchor="start"><tspan x="64" dy="0">A tiny task has no review and no QA: it is clean when its checks pass.</tspan><tspan x="64" dy="33.599999999999994">The state tool checks each move. A new commit voids the verdicts.</tspan></text>
