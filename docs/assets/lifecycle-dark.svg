<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 564" width="1100" height="564" role="img" aria-label="A task's life: framed, briefed, building, reviewing, verifying, verified, merged. A product question holds the task until your answer. Findings or a QA failure send it to repairing, then to review again, at most 3 rounds. Verified needs one clean cycle; autopilot merges after one for a small task, two for a large or risky one. A tiny task has no review and no QA: it is clean when its checks pass.">
