<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 687" width="1100" height="687" role="img" aria-label="A task's life: framed, briefed, building, reviewing, verifying, verified, merged. A product question holds the task until your answer. Findings to fix in review, or a QA failure, send it to repairing, then to review again: 3 rounds by default, then the task is held. Verified needs one clean cycle; autopilot merges after one for a tiny or small task, two for a large or risky one. A tiny task has no review and no QA: it is clean when its checks pass. Other states: designing, awaiting you, pr-ready, replan, concluded and abandoned.">
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<defs>
