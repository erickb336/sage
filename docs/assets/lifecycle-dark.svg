<rect x="526.9" y="256" width="189" height="50" rx="8" fill="#17100C" stroke="#FF6A55" stroke-width="2"/><text x="621.4" y="289.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFF3E6" text-anchor="middle"><tspan x="621.4" dy="0">repairing</tspan></text>
<text x="621.4" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="middle"><tspan x="621.4" dy="0">3 rounds by default, then held</tspan></text>
<rect x="36" y="384" width="1028" height="267.2" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/>
<text x="64" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFF3E6" text-anchor="start"><tspan x="64" dy="0">Verified needs 1 clean cycle. Autopilot merges after the task's clean cycles:</tspan><tspan x="64" dy="33.599999999999994">1 for a tiny or small task, 2 for a large task or a task with a risk flag.</tspan></text>
<text x="64" y="491.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="64" dy="0">A tiny task has no review and no QA: it is clean when its checks pass.</tspan><tspan x="64" dy="33.599999999999994">The state tool checks each move. A new commit voids the verdicts.</tspan><tspan x="64" dy="33.599999999999994">Other states: designing and awaiting you (a large task's design), pr-ready</tspan><tspan x="64" dy="33.599999999999994">(it waits for your merge), replan (a new plan), concluded (an investigation),</tspan><tspan x="64" dy="33.599999999999994">and abandoned (from any state).</tspan></text>
</g>
<rect x="0.75" y="0.75" width="1098.5" height="685.5" rx="23.25" fill="none" stroke="#3A2414" stroke-width="1.5"/>
</svg>
