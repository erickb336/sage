<text x="621.4" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6B5242" text-anchor="middle"><tspan x="621.4" dy="0">3 rounds by default, then held</tspan></text>
<rect x="36" y="384" width="1028" height="300.79999999999995" rx="8" fill="#FFFFFF" stroke="#E5600B" stroke-width="1.5"/>
<text x="64" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A0E07" text-anchor="start"><tspan x="64" dy="0">Verified needs 1 clean cycle. Autopilot merges after the task's clean cycles:</tspan><tspan x="64" dy="33.599999999999994">1 for a tiny or small task, 2 for a large task or a task with a risk flag.</tspan></text>
<text x="64" y="491.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="64" dy="0">A tiny task has no review and no QA: it is clean when its checks pass.</tspan><tspan x="64" dy="33.599999999999994">A tiny arena has the code review.</tspan><tspan x="64" dy="33.599999999999994">The state tool checks each move. A new commit voids the verdicts.</tspan><tspan x="64" dy="33.599999999999994">Other states: designing and awaiting you (a large task's design), pr-ready</tspan><tspan x="64" dy="33.599999999999994">(it waits for your merge), replan (a new plan), concluded (an investigation),</tspan><tspan x="64" dy="33.599999999999994">and abandoned (from any state).</tspan></text>
