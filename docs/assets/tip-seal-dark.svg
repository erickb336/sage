<text x="262" y="110.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ECE6DC" text-anchor="start"><tspan x="262" dy="0">Seal the lesson: give a mistake that comes back twice</tspan><tspan x="262" dy="33.599999999999994">a lasting fix. A test or a check in code first; a principle</tspan><tspan x="262" dy="33.599999999999994">or a standing order only when code cannot hold it.</tspan><tspan x="262" dy="33.599999999999994">That's how the dojo gets stronger.</tspan></text>
